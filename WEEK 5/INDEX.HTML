<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My portfolio</title>
    <link rel="stylesheet" href="style.css">

</head>
<body>
      <header id="hero">
            <h1>Tech Club</h1>
            <p>Learn. Code. Grow.</p>
        </header>

        <section class="card">
            <h2>Upcoming Events</h2>
   <table>
     <tr>
         <th>Event</th>
         <th>Date</th>
         <th>Venue</th>
    </tr>


     <tr>
         <td>HTML Workshop</td>
       <td>12 Nov</td>
         <td>Lab 1</td>
 </tr>
     <tr>
       <td>Hackathon</td>
      <td>20 Nov</td>
     <td>Seminar Hall</td>
    </tr>
         </table>
        </section>
                <section class="card">
            <h2>Register</h2>

            <form>
                <div class="form-row">
                    <label for="name">Name:</label>
                    <input
                        type="text"
                        id="name"
                        name="name"
                        placeholder="Your name"
                        required
                    >
                </div>

                <div class="form-row">
                    <label for="email">Email:</label>
                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="you@example.com"
                        required
                    >
                </div>

                <button type="submit">Register</button>
            </form>
        </section>
    </div>

</body>
</html>
