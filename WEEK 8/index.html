
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Grid Assignment</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <h1>My CSS Grid Layout</h1>

    <div class="grid-container">
        <div class="box">Box 1</div>
        <div class="box">Box 2</div>
        <div class="box">Box 3</div>
        <div class="box">Box 4</div>
    </div>

<div class="responsive-grid">

    <div class="box">HTML</div>
    <div class="box">CSS</div>
    <div class="box">JavaScript</div>
    <div class="box">React</div>
    <div class="box">Node.js</div>
    <div class="box">MongoDB</div>

</div>

<div class="layout">

    <header class="head">
        <h2>Header</h2>
    </header>

    <aside class="side">
        <h2>Sidebar</h2>
    </aside>

    <main class="main">
        <h2>Main Content</h2>
        <p>Welcome to my website.</p>
    </main>

    <footer class="foot">
        <h2>Footer</h2>
    </footer>

</div>

<div class="flex-container">

    <div class="card">
        <span class="icon">💻</span>
        <div>
            <h3>HTML</h3>
            <p>Structure of Web Pages</p>
        </div>
    </div>

    <div class="card">
        <span class="icon">🎨</span>
        <div>
            <h3>CSS</h3>
            <p>Design and Styling</p>
        </div>
    </div>

    <div class="card">
        <span class="icon">⚡</span>
        <div>
            <h3>JavaScript</h3>
            <p>Website Interactivity</p>
        </div>
    </div>

</div>

</body>
</html>
