
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mobile First Design</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1>My Website</h1>
    </header>

    <main class="container">
        <div class="box">Home</div>
        <div class="box">About</div>
        <div class="box">Services</div>
        <div class="box">Contact</div>
    </main>
    
    <div class="card">
        <h1>My Profile</h1>

        <img src="https://images.unsplash.com/photo-1500648767791-00dcc994a43e?w=600"
             alt="Profile portrait">

        <h2>Web Developer</h2>

        <p>
            I am learning HTML, CSS and responsive web design.
        </p>
    </div>

        <header class="header">

        <h1>My Portfolio</h1>

        <nav class="navbar">
            <a href="#home">Home</a>
            <a href="#about">About</a>
            <a href="#skills">Skills</a>
            <a href="#contact">Contact</a>
        </nav>

    </header>

    <main class="grid-container">

        <section id="home" class="box">
            <h2>Home</h2>
            <p>Welcome to my portfolio.</p>
        </section>

        <section id="about" class="box">
            <h2>About</h2>
            <p>Learn more about me.</p>
        </section>

        <section id="skills" class="box">
            <h2>Skills</h2>
            <p>HTML, CSS, JavaScript.</p>
        </section>

        <section id="contact" class="box">
            <h2>Contact</h2>
            <p>Contact me for projects.</p>
        </section>

    </main>


</body>
</html>
